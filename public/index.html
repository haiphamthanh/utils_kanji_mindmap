<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漢字 MAP — Sơ đồ Kanji</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("kanji-theme") || "dark";
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">漢</span>
      <h1>Sơ đồ Kanji</h1>
    </div>
    <div class="header-actions">
      <button id="listBtn" class="ghost-btn" title="Danh sách Kanji">Danh sách</button>
      <button id="historyBtn" class="ghost-btn" title="Lịch sử">Lịch sử</button>
      <button id="themeBtn" class="ghost-btn" title="Đổi giao diện">🌙</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input
        id="searchInput"
        type="text"
        autocomplete="off"
        placeholder="Tìm Hán tự, Hán-Việt, nghĩa…"
      />
      <button id="clearSearch" class="clear-btn" title="Xóa" hidden>×</button>
      <ul id="suggestions" class="suggestions" hidden></ul>
    </div>

    <button id="createBtn" class="primary-btn">Tạo sơ đồ</button>

    <div class="jlpt-filters" id="jlptFilters"></div>

    <label class="depth-select" title="Số cấp độ hiển thị">
      <span>Độ sâu</span>
      <select id="depthSelect">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
      </select>
    </label>

    <label class="depth-select" title="Kiểu bố cục">
      <span>Layout</span>
      <select id="layoutSelect">
        <option value="auto">Tự động</option>
        <option value="radial">Hướng tâm</option>
        <option value="grid" selected>Lưới</option>
      </select>
    </label>

    <label class="edit-switch" title="Bật để ẩn/hiện node">
      <input type="checkbox" id="editToggle" />
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span>Ẩn node</span>
    </label>

    <div class="zoom-controls">
      <button id="zoomOut" class="icon-btn" title="Thu nhỏ">−</button>
      <input type="range" id="zoomRange" min="25" max="300" value="100" />
      <button id="zoomIn" class="icon-btn" title="Phóng to">+</button>
      <button id="fitBtn" class="ghost-btn" title="Vừa vặn">Vừa vặn</button>
    </div>
  </div>

  <main class="graph-area">
    <svg id="kanjiGraph" aria-label="Sơ đồ quan hệ Kanji">
      <g id="viewport">
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>

    <aside id="detailPanel" class="detail-panel" hidden></aside>

    <div id="tooltip" class="tooltip" hidden></div>

    <div id="emptyState" class="empty-state" hidden>
      <p>Không tìm thấy Hán tự phù hợp.</p>
      <p class="muted">Thử tìm một Hán tự khác.</p>
    </div>
  </main>

  <footer class="statusbar">
    <nav id="breadcrumb" class="breadcrumb" aria-label="Lịch sử khám phá"></nav>
    <span id="status" class="status-text"></span>
  </footer>

  <div id="listModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-panel" role="dialog" aria-label="Danh sách Kanji">
      <header class="modal-head">
        <h2>Danh sách Kanji</h2>
        <button id="listClose" class="icon-btn" title="Đóng">×</button>
      </header>
      <div class="modal-search">
        <span class="search-icon">🔍</span>
        <input id="listSearch" type="text" autocomplete="off" placeholder="Tìm Hán tự, Hán-Việt, nghĩa…" />
      </div>
      <div id="listLevels" class="list-levels"></div>
      <div class="list-toggles">
        <button id="listFav" class="mark-toggle" title="Chỉ hiện yêu thích">★ Yêu thích</button>
        <button id="listLearned" class="mark-toggle" title="Chỉ hiện đã nhớ">✓ Đã nhớ</button>
      </div>
      <div id="listBody" class="list-body"></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
